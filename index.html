<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0f17">
<title>ドライブ速度計</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="reviewBar"><span id="reviewName"></span><button id="btnExitReview">✕ 戻る</button></div>

<div id="app" class="app landscape">
  <section class="meter">
    <div class="topbar">
      <span id="gps" class="gps">GPS オフ</span>
      <span class="spacer"></span>
      <button id="btnRecords" class="icon" aria-label="記録">📁</button>
      <button id="btnRec" class="icon" aria-label="記録開始">▶</button>
      <button id="btnSettings" class="icon" aria-label="設定">⚙</button>
    </div>
    <!-- 左半分をタップで設定速度 −10、右半分で +10 -->
    <div id="speedbox" class="speedbox">
      <div class="speed"><span id="speed">--</span><small>km/h</small></div>
      <div class="delta">設定 <b id="dTarget">60</b> ±<span id="dTol">10</span> km/h<span id="dDiff"></span></div>
      <div id="toast" class="toast"></div>
    </div>
    <div class="barwrap">
      <div class="bar">
        <div id="band" class="band"></div>
        <div id="fill" class="fill"></div>
        <div class="center"></div>
        <div id="ovL" class="over l">◀</div>
        <div id="ovR" class="over r">▶</div>
      </div>
      <div id="barLbl" class="barlbl"></div>
    </div>
    <div class="stats">
      <div class="stat"><span>最高速度</span><b id="sMax">--</b></div>
      <div class="stat"><span>平均（走行中）</span><b id="sAvg">--</b></div>
      <div class="stat"><span>走行距離</span><b id="sDist">--</b></div>
      <div class="stat"><span>記録時間</span><b id="sTime">--</b></div>
      <div class="stat"><span id="sAltLbl">現在標高</span><b id="sAlt">--</b></div>
      <div class="stat"><span>累積上昇</span><b id="sGain">--</b></div>
    </div>
  </section>
  <section class="chart recent">
    <div class="ttl"><span id="recentTtl">直近 5分</span><span id="muni" class="muni" hidden></span></div>
    <canvas id="cRecent"></canvas>
  </section>
  <section class="chart all">
    <div class="ttl" id="allTtl">ドライブ全体</div>
    <canvas id="cAll"></canvas>
  </section>
  <!-- 市町村の境界通知 -->
  <div id="notice" class="notice"><div class="from" id="noticeFrom"></div><div class="to"><span id="noticeTo"></span><small>に入りました</small></div></div>
</div>

<!-- 記録一覧 -->
<dialog id="records" class="full">
  <div class="rec">
    <header><button id="btnCloseRecords" class="icon" aria-label="閉じる">←</button><h2>ドライブ記録</h2></header>
    <div id="recCur" class="cur">
      <div class="t" id="recCurState">● 記録中のドライブ</div>
      <div class="s" id="recCurStats"></div>
      <div class="note" id="recCurSaved"></div>
      <button id="btnSaveCur" class="btn pri">名前を付けて保存</button>
    </div>
    <div id="recList" class="items"></div>
    <div class="foot">
      <button id="btnImport" class="btn">ファイルから読み込む</button>
      <button id="btnExportAll" class="btn">すべて書き出し</button>
    </div>
  </div>
  <input id="fileIn" type="file" accept=".json,application/json" hidden>
</dialog>

<!-- 名前の入力（保存・名前変更） -->
<dialog id="nameDlg">
  <form method="dialog" class="dlg">
    <h3 id="nameTitle">名前を付けて保存</h3>
    <label for="nameIn">名前</label>
    <input id="nameIn" type="text" maxlength="40" autocomplete="off">
    <p id="nameInfo" class="info"></p>
    <label id="nameNewRow" class="chk"><input id="nameNew" type="checkbox"> 保存後に新しいドライブを開始する</label>
    <div class="bt">
      <button type="button" id="nameCancel" class="btn">キャンセル</button>
      <button value="ok" class="btn pri">OK</button>
    </div>
  </form>
</dialog>

<!-- 設定 -->
<dialog id="settings">
  <form method="dialog" class="set">
    <h2>設定</h2>

    <div class="field">
      <label for="fTarget">設定速度（速度表示の左側タップで −10、右側タップで ＋10）</label>
      <div class="num"><input id="fTarget" type="number" inputmode="numeric" min="10" max="200" step="5"><span>km/h</span></div>
      <div class="chips" data-for="fTarget" data-values="30,40,50,60,70,80,100"></div>
    </div>

    <div class="field">
      <label for="fTol">許容幅（この差を超えると 超過＝赤／低下＝青 で表示）</label>
      <div class="num"><span>±</span><input id="fTol" type="number" inputmode="numeric" min="1" max="50" step="1"><span>km/h</span></div>
      <div class="chips" data-for="fTol" data-values="5,10,15,20"></div>
    </div>

    <div class="field">
      <label for="fBar">速度バーの表示範囲（設定速度の前後）</label>
      <div class="num"><span>±</span><input id="fBar" type="number" inputmode="numeric" min="5" max="100" step="5"><span>km/h</span></div>
      <div class="chips" data-for="fBar" data-values="10,20,30,40"></div>
    </div>

    <div class="field">
      <label for="fWin">直近グラフの表示時間（グラフをピンチしても変更できます）</label>
      <div class="num"><input id="fWin" type="number" inputmode="decimal" min="0.5" max="120" step="0.5"><span>分</span></div>
      <div class="chips" data-for="fWin" data-values="1,3,5,10,30,60"></div>
    </div>

    <div class="field">
      <label for="fRefresh">表示の更新間隔（短いほど滑らか、長いほどちらつきにくい）</label>
      <div class="num"><input id="fRefresh" type="number" inputmode="decimal" min="0.2" max="5" step="0.1"><span>秒</span></div>
      <div class="chips" data-for="fRefresh" data-values="0.5,1,1.5,2"></div>
    </div>

    <div class="field">
      <label for="fLayout">画面の向き</label>
      <select id="fLayout">
        <option value="auto">自動（端末の向きに合わせる）</option>
        <option value="portrait">縦で固定</option>
        <option value="landscape">横で固定</option>
      </select>
    </div>

    <div class="field row">
      <label for="fBeep">警告時に音を鳴らす</label>
      <input id="fBeep" type="checkbox">
    </div>

    <div class="field row">
      <label for="fMuniSound">市町村が変わったときに音を鳴らす</label>
      <input id="fMuniSound" type="checkbox">
    </div>

    <div class="field">
      <label for="fAltOff">GPS高度の補正値（標高データが取れないときだけ使用。GPS高度は海抜より30〜40m高く出ることが多いため）</label>
      <div class="num"><input id="fAltOff" type="number" inputmode="numeric" min="-100" max="100" step="1"><span>m</span></div>
    </div>

    <div class="actions">
      <button type="button" id="btnDemo" class="sec">デモ走行を開始</button>
      <button type="button" id="btnReset" class="danger">記録をリセット</button>
    </div>
    <p id="info" class="info"></p>
    <p class="info">標高・市町村：国土地理院（標高タイル・住所検索API）。位置情報はこれらの取得のためだけに国土地理院へ送られます。</p>
    <button class="close" value="close">閉じる</button>
  </form>
</dialog>

<script src="app.js"></script>
</body>
</html>
